<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#143f38">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23143f38'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='13' fill='%23f6f3ec' font-family='sans-serif' font-weight='700'%3EQA%3C/text%3E%3C/svg%3E">
  <title>QA AI — ერთწლიანი გეგმა</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f0e7;
      --paper: #fffdf8;
      --ink: #1b1914;
      --muted: #5f584e;
      --line: #e3dacb;
      --teal: #143f38;
      --teal-ink: #f6f3ec;
      --high: #8c2f14;
      --high-bg: #fde7de;
      --med: #3c4b34;
      --med-bg: #e6eee0;
      --shadow: 0 18px 40px rgba(28, 25, 20, 0.06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(20, 63, 56, 0.08), transparent 32rem),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans Georgian", Sylfaen, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    a { color: var(--teal); }

    .skip {
      position: absolute;
      left: 1rem;
      top: -4rem;
      background: var(--ink);
      color: white;
      padding: 0.5rem 0.8rem;
    }

    .skip:focus { top: 1rem; }

    .wrap {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }

    header.site {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(244, 240, 231, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .bar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      min-height: 4rem;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand span {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.92rem;
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav button {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.92rem;
    }

    nav button[aria-current="page"] {
      background: var(--teal);
      color: var(--teal-ink);
    }

    main { padding: 2.4rem 0 4rem; }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 1.5rem;
      align-items: stretch;
    }

    .eyebrow {
      margin: 0 0 0.6rem;
      color: var(--teal);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.6rem);
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    .quote {
      margin: 1.2rem 0 0;
      padding-left: 1rem;
      border-left: 3px solid var(--teal);
      font-size: 1.15rem;
    }

    .meta-card, .panel, .goal, .risk, .rule {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .meta-card {
      padding: 1.2rem 1.3rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
    }

    .stat strong {
      display: block;
      font-size: 1.6rem;
      line-height: 1;
    }

    .stat span, .updated, .muted { color: var(--muted); }

    .updated { margin: 0; font-size: 0.92rem; }

    .pvm, .goals, .how, .risks {
      display: grid;
      gap: 0.8rem;
    }

    .pvm { grid-template-columns: 1fr; margin-top: 1rem; }

    .pvm h3 {
      margin: 0 0 0.7rem;
      font-size: 1.08rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .pvm .lead + .lead { margin-top: 0.75rem; }

    .pvm ul, .interview ul {
      margin: 0.35rem 0 0;
      padding-left: 1.15rem;
      display: grid;
      gap: 0.35rem;
    }

    .interview { margin-top: 2.4rem; }

    .interview h2 { margin: 0 0 0.8rem; }

    .interview .panel + .panel { margin-top: 0.8rem; }

    .q-num {
      margin: 0.95rem 0 0.15rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 700;
      color: var(--muted);
    }

    .interview .lead + .lead { margin-top: 0.45rem; }

    .view[hidden] { display: none; }

    .bars { display: grid; gap: 0.65rem; }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(7rem, 14rem) 1fr auto;
      gap: 0.7rem;
      align-items: center;
    }

    .track {
      height: 0.55rem;
      background: #efeae1;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      display: block;
      height: 100%;
      background: var(--teal);
      border-radius: 999px;
    }

    .bar-value {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stats.four { grid-template-columns: repeat(4, 1fr); }

    .panel { padding: 1rem 1.1rem 1.15rem; }

    .section-head h2 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }

    .panel h2, .goal h3, .rule h3 { margin: 0; }

    .lead { margin: 0; font-size: 1.02rem; white-space: pre-line; }

    .kicker {
      margin: 0 0 0.35rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    section { margin-top: 2.6rem; }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: end;
      margin-bottom: 0.9rem;
    }

    .section-head p { margin: 0.3rem 0 0; color: var(--muted); }

    .goals { grid-template-columns: 1fr 1fr; }

    .goal {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.8rem;
      padding: 0.9rem 1rem;
    }

    .num {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--teal);
      color: var(--teal-ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.45rem;
    }

    .tag, .pill {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      background: #efeae1;
      color: var(--ink);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .tabs, .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    button, input {
      font: inherit;
      color: inherit;
    }

    .tabs button, .filters button {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    .tabs button[aria-selected="true"], .filters button[aria-pressed="true"] {
      background: var(--teal);
      color: var(--teal-ink);
      border-color: var(--teal);
    }

    input[type="search"] {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      min-width: min(100%, 16rem);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
    }

    table { width: 100%; border-collapse: collapse; min-width: 640px; }

    th, td {
      text-align: left;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: #f7f3eb;
    }

    tr:last-child td { border-bottom: 0; }

    .id, .jira {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      white-space: nowrap;
    }

    .jira {
      display: inline-block;
      margin-left: 0.55rem;
      font-size: 0.82rem;
    }

    .jira-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.28rem;
      margin-top: 0.4rem;
    }

    .jira-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .jira-list .jira { margin-left: 0; }

    .pri {
      display: inline-block;
      border-radius: 999px;
      padding: 0.12rem 0.55rem;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .pri.high { background: var(--high-bg); color: var(--high); }
    .pri.medium { background: var(--med-bg); color: var(--med); }

    .st {
      display: inline-block;
      border-radius: 999px;
      padding: 0.12rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      background: #efeae1;
      color: var(--muted);
    }

    .st.done { background: #e5f2ec; color: var(--teal); }
    .st.progress { background: var(--med-bg); color: var(--med); }
    .st.hold { background: var(--high-bg); color: var(--high); }

    .activity { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

    .activity-card { padding: 1.05rem 1.15rem 1.15rem; }

    .activity-card.progress { box-shadow: inset 0 3px 0 var(--med); }

    .activity-card.done { box-shadow: inset 0 3px 0 var(--teal); }

    .activity-card h3 { margin: 0; font-size: 1.2rem; letter-spacing: -0.02em; }

    .activity-card .kicker { margin-top: 0.35rem; }

    .activity-list {
      list-style: none;
      margin: 0.85rem 0 0;
      padding: 0;
    }

    .activity-list li {
      display: grid;
      grid-template-columns: 6.6rem 1fr;
      gap: 0.75rem;
      align-items: start;
      padding: 0.75rem 0;
      border-top: 1px solid var(--line);
    }

    .activity-list li:first-child { border-top: 0; padding-top: 0.15rem; }

    .when-badge {
      display: grid;
      gap: 0.05rem;
      justify-items: center;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      border-radius: 12px;
      padding: 0.35rem 0.4rem;
      text-align: center;
    }

    .when-date { font-size: 0.78rem; font-weight: 700; line-height: 1.2; }

    .when-note { font-size: 0.68rem; font-weight: 500; line-height: 1.2; }

    .activity-card.progress .when-badge { background: var(--med-bg); color: var(--med); }

    .activity-card.done .when-badge { background: #e5f2ec; color: var(--teal); }

    .activity-task { font-weight: 500; line-height: 1.35; }

    .activity-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
      margin-top: 0.28rem;
    }

    .activity-meta .jira { margin-left: 0; }

    .plan-layout {
      display: grid;
      grid-template-columns: 16.5rem 1fr;
      gap: 0.8rem;
      align-items: start;
    }

    .status-col {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .status-filter {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 0.7rem 0.75rem;
      cursor: pointer;
      text-align: left;
    }

    .status-filter.on {
      border-color: var(--teal);
      background: #e7f0ee;
    }

    .status-filter .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: left;
      color: inherit;
    }

    .status-filter .count-num {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status-pris {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.45rem;
    }

    .status-pris button {
      border: 0;
      border-radius: 999px;
      padding: 0.12rem 0.5rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .status-pris button.high { background: var(--high-bg); color: var(--high); }
    .status-pris button.medium { background: var(--med-bg); color: var(--med); }
    .status-pris button[aria-pressed="true"] { outline: 2px solid var(--teal); }

    .risks { grid-template-columns: 1fr 1fr; }

    .risk { padding: 1rem 1.1rem; }

    .risk strong { display: block; margin-bottom: 0.25rem; }

    .how { grid-template-columns: 1fr 1fr; }

    .rule {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.8rem;
      padding: 0.95rem 1rem;
    }

    .rule .num { background: #efeae1; color: var(--ink); }

    footer {
      border-top: 1px solid var(--line);
      padding: 1.4rem 0 2rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .error { padding: 1rem; background: var(--high-bg); border-radius: 12px; }

    .empty { padding: 1rem; color: var(--muted); }

    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }

    @media (max-width: 860px) {
      .hero, .pvm, .goals, .risks, .how, .stats.four, .plan-layout, .activity { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">შინაარსზე გადასვლა</a>
  <header class="site">
    <div class="wrap bar">
      <div class="brand">QA AI <span id="version">გეგმა</span></div>
      <nav aria-label="გვერდები">
        <button type="button" data-page="plan">გეგმა</button>
        <button type="button" data-page="pvm">PVM</button>
        <button type="button" data-page="feedback">ფიდბექი</button>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap">
    <p class="empty">გეგმა იტვირთება…</p>
  </main>
  <footer>
    <div class="wrap" id="foot"></div>
  </footer>
  <script>
    const PRIORITY = { high: "მაღალი", medium: "საშუალო" };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function formatWhen(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "";
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Tbilisi",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);
      const pick = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return pick.day + "." + pick.month + "." + pick.year + ", " + pick.hour + ":" + pick.minute;
    }

    function oneDecimal(value) {
      return (Math.round(value * 10) / 10).toFixed(1);
    }

    function bars(items, max, suffix) {
      const list = el("div", "bars");
      items.forEach((item) => {
        const row = el("div", "bar-row");
        const track = el("div", "track");
        const fill = el("span", "fill");
        const width = max > 0 ? Math.max(0, Math.min(100, (item.value / max) * 100)) : 0;
        fill.style.width = width + "%";
        track.append(fill);
        row.append(el("span", null, item.label), track, el("span", "bar-value", item.text || String(item.value) + (suffix || "")));
        list.append(row);
      });
      return list;
    }

    function renderFeedback(feedback) {
      const page = el("div", "view");
      page.dataset.view = "feedback";
      const head = el("div", "section-head");
      const title = el("div");
      title.append(el("h2", null, feedback.title || ""));
      const intro = el("p", null, feedback.intro || "");
      const sourceLine = el("p");
      sourceLine.append(document.createTextNode("წყარო: "));
      const source = safeUrl(feedback.sourceUrl);
      if (source) {
        const link = el("a", null, feedback.sourceLabel || source);
        link.href = source;
        sourceLine.append(link);
      }
      title.append(intro, sourceLine);
      head.append(title);

      const members = feedback.members || [];
      const avgHours = members.length ? members.reduce((sum, member) => sum + Number(member.hours), 0) / members.length : 0;
      const avgTrust = members.length ? members.reduce((sum, member) => sum + Number(member.trust), 0) / members.length : 0;
      const stats = el("div", "stats four");
      [
        [oneDecimal(avgHours) + "სთ", "საშუალო ყოველდღიური AI გამოყენება"],
        [oneDecimal(avgTrust) + "/5", "საშუალო ნდობის დონე"],
        [members.length + "/" + members.length, "ყოველდღიური Cursor მომხმარებლები"],
        [String(members.length), "გამოკითხული წევრები"]
      ].forEach(([value, label]) => {
        const stat = el("div", "stat");
        stat.append(el("strong", null, value), el("span", null, label));
        stats.append(stat);
      });

      const trust = el("section");
      trust.append(el("h3", null, "ნდობის დონე წევრების მიხედვით"));
      trust.append(bars(members.map((member) => ({
        label: member.name,
        value: Number(member.trust),
        text: String(member.trust)
      })), 5, ""));

      const hoursMax = members.reduce((max, member) => Math.max(max, Number(member.hours)), 0);
      const hours = el("section");
      hours.append(el("h3", null, "ყოველდღიური AI გამოყენება (საათები)"));
      hours.append(bars(members.map((member) => ({
        label: member.name,
        value: Number(member.hours),
        text: member.hours + "სთ"
      })), hoursMax, ""));

      const areas = feedback.areas || [];
      const areaMax = areas.reduce((max, area) => Math.max(max, Number(area.count)), 0);
      const areaSection = el("section");
      areaSection.append(el("h3", null, "AI გამოყენება სფეროების მიხედვით (რამდენი წევრი იყენებს)"));
      areaSection.append(bars(areas.map((area) => ({
        label: area.label,
        value: Number(area.count),
        text: area.count + "/9"
      })), areaMax || 9, ""));

      const problems = el("section");
      problems.append(el("h3", null, "ძირითადი პრობლემები"));
      const tableWrap = el("div", "table-wrap");
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      ["პრობლემა", "მოხსენიებები"].forEach((label) => headRow.append(el("th", null, label)));
      thead.append(headRow);
      const tbody = document.createElement("tbody");
      (feedback.problems || []).forEach((problem) => {
        const row = document.createElement("tr");
        row.append(el("td", null, problem.issue || ""), el("td", null, problem.votes + "/9"));
        tbody.append(row);
      });
      table.append(thead, tbody);
      tableWrap.append(table);
      problems.append(tableWrap);

      const training = el("section");
      training.append(el("h3", null, "ტრენინგის მოთხოვნები"));
      const trainingGrid = el("div", "goals");
      (feedback.training || []).forEach((need) => {
        const card = el("article", "panel");
        card.append(el("p", "lead", need));
        trainingGrid.append(card);
      });
      training.append(trainingGrid);

      const quotes = el("section");
      quotes.append(el("h3", null, "თიმის მნიშვნელოვანი შეხედულებები"));
      const quoteList = el("div", "risks");
      (feedback.quotes || []).forEach((quote) => {
        const card = el("article", "risk");
        card.append(el("strong", null, quote.name || ""), el("p", "lead", quote.text || ""));
        quoteList.append(card);
      });
      quotes.append(quoteList);

      const tools = feedback.tools || [];
      const toolsSection = el("section");
      toolsSection.append(el("h3", null, "რომელ ინსტრუმენტს იყენებს"));
      toolsSection.append(bars(tools.map((tool) => ({
        label: tool.label,
        value: Number(tool.count),
        text: tool.count + "/9"
      })), 9, ""));

      const saved = feedback.savedTime || [];
      const savedMax = saved.reduce((max, item) => Math.max(max, Number(item.count)), 0);
      const savedSection = el("section");
      savedSection.append(el("h3", null, "სად ზოგავს დროს"));
      savedSection.append(bars(saved.map((item) => ({
        label: item.label,
        value: Number(item.count),
        text: item.count + "/9"
      })), savedMax || 9, ""));

      const next = el("section");
      next.append(el("h3", null, "შემდეგი ნაბიჯი ინტერვიუებიდან"));
      const nextGrid = el("div", "goals");
      (feedback.nextSteps || []).forEach((step) => {
        const card = el("article", "panel");
        card.append(el("p", "lead", step));
        nextGrid.append(card);
      });
      next.append(nextGrid);

      const leads = el("section");
      leads.append(el("h3", null, "Chapter Lead რომ ყოფილიყო, პირველ რიგში"));
      const leadList = el("div", "risks");
      (feedback.leadIdeas || []).forEach((idea) => {
        const card = el("article", "risk");
        card.append(el("strong", null, idea.name || ""), el("p", "lead", idea.text || ""));
        leadList.append(card);
      });
      leads.append(leadList);

      page.append(head, stats, trust, hours, areaSection, toolsSection, savedSection, problems, training, quotes, next, leads);
      return page;
    }

    function uniqueCount(plan) {
      const ids = new Set();
      (plan.quarters || []).forEach((quarter) => {
        (quarter.items || []).forEach((item) => ids.add(item.id));
      });
      return ids.size;
    }

    function render(plan) {
      const main = document.querySelector("main");
      const version = document.querySelector("#version");
      version.textContent = plan.version ? "v" + plan.version : "გეგმა";
      document.title = plan.title || "QA AI — ერთწლიანი გეგმა";

      const hero = el("div", "hero");
      const intro = el("div");
      intro.append(
        el("p", "eyebrow", plan.range || ""),
        el("h1", null, plan.title || "QA AI")
      );

      const meta = el("aside", "meta-card");
      const stats = el("div", "stats");
      [
        [String((plan.goals || []).length), "მიზანი"],
        [String(uniqueCount(plan)), "ტასკი"],
        [String((plan.quarters || []).length), "კვარტალი"]
      ].forEach(([value, label]) => {
        const stat = el("div", "stat");
        stat.append(el("strong", null, value), el("span", null, label));
        stats.append(stat);
      });
      meta.append(stats, el("p", "updated", "ბოლო სინქი: " + formatWhen(plan.updatedAt)));
      hero.append(intro, meta);

      const pvmPage = el("div", "view");
      pvmPage.dataset.view = "pvm";
      const pvmData = plan.pvm || {};
      const pvmHead = el("div", "section-head");
      pvmHead.append(el("h2", null, pvmData.title || "PVM — Purpose, Vision, Mission"));
      const pvmGrid = el("div", "pvm");
      (pvmData.sections || []).forEach((section) => {
        const card = el("article", "panel");
        card.append(el("h3", null, section.title || ""));
        const paragraphs = section.paragraphs || (section.text ? [section.text] : []);
        paragraphs.forEach((text) => card.append(el("p", "lead", text)));
        pvmGrid.append(card);
      });
      [pvmData.achieving, pvmData.howWeWork].forEach((block) => {
        if (!block || !(block.items || []).length) return;
        const card = el("article", "panel");
        card.append(el("h3", null, block.title || ""));
        const list = document.createElement("ul");
        block.items.forEach((item) => list.append(el("li", null, item)));
        card.append(list);
        pvmGrid.append(card);
      });
      pvmPage.append(pvmHead, pvmGrid);

      const goals = el("section");
      goals.id = "goals";
      const goalsHead = el("div", "section-head");
      const goalsTitle = el("div");
      goalsTitle.append(el("h2", null, "10 მიზანი"));
      goalsHead.append(goalsTitle);
      const goalGrid = el("div", "goals");
      (plan.goals || []).forEach((goal) => {
        const card = el("article", "goal");
        const body = el("div");
        body.append(el("h3", null, goal.text || ""));
        const tags = el("div", "tags");
        tags.append(el("span", "tag", goal.tasks || "—"), el("span", "tag", goal.quarter || "—"));
        body.append(tags);
        card.append(el("div", "num", String(goal.n ?? "")), body);
        goalGrid.append(card);
      });
      goals.append(goalsHead, goalGrid);

      const planSection = el("section");
      planSection.id = "plan";
      const planHead = el("div", "section-head");
      const planTitle = el("div");
      planTitle.append(el("h2", null, "სამუშაო გეგმა"));
      planHead.append(planTitle);

      const toolbar = el("div", "toolbar");
      const tabs = el("div", "tabs");
      tabs.setAttribute("role", "tablist");
      const filters = el("div", "filters");
      const search = el("input");
      search.type = "search";
      search.placeholder = "ძებნა";
      search.setAttribute("aria-label", "ტასკის ძებნა");
      const tableWrap = el("div", "table-wrap");
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      ["ID", "ტასკი", "ნაწილი", "პრიორიტეტი"].forEach((label) => headRow.append(el("th", null, label)));
      thead.append(headRow);
      const tbody = document.createElement("tbody");
      table.append(thead, tbody);
      tableWrap.append(table);
      const count = el("p", "count");

      const quarters = plan.quarters || [];
      let activeId = (quarters.find((quarter) => quarter.current) || quarters[0] || {}).id || "";
      if (location.hash) {
        const fromHash = quarters.find((quarter) => "#" + quarter.id === location.hash);
        if (fromHash) activeId = fromHash.id;
      }
      let priority = "all";
      let statusFilter = "all";
      const STATUS_ORDER = ["In Progress", "Backlog", "Needs Clarification", "ON HOLD", "Done"];

      function ticketLinks(item) {
        if (Array.isArray(item.links) && item.links.length) {
          return item.links.map((link) => ({
            key: link.key || link,
            status: link.status || "",
            since: link.since || "",
            done: link.done || ""
          }));
        }
        if (item.jira) {
          return [{ key: item.jira, status: item.status || "", since: item.since || "", done: item.done || "" }];
        }
        return [];
      }

      function jiraLink(key) {
        const link = document.createElement("a");
        link.className = "jira";
        link.href = "https://oppa-support.atlassian.net/browse/" + key;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = key;
        return link;
      }

      function statusPill(status) {
        const slug = String(status).toLowerCase().replace(/\s+/g, "");
        const kind = slug === "done" ? "done" : slug === "inprogress" ? "progress" : slug === "onhold" ? "hold" : "";
        return el("span", "st" + (kind ? " " + kind : ""), status);
      }

      function itemStatuses(item) {
        const fromLinks = ticketLinks(item).map((link) => link.status).filter(Boolean);
        if (fromLinks.length) return [...new Set(fromLinks)];
        if (item.status) return [item.status];
        return [];
      }

      function paint() {
        tabs.querySelectorAll("button").forEach((button) => {
          button.setAttribute("aria-selected", button.dataset.id === activeId ? "true" : "false");
        });
        const quarter = quarters.find((item) => item.id === activeId);
        const items = (quarter && quarter.items) || [];
        paintStatuses(items);
        const query = search.value.trim().toLowerCase();
        const rows = items.filter((item) => {
          const priOk = priority === "all" || item.priority === priority;
          const statuses = itemStatuses(item);
          const statusOk = statusFilter === "all"
            || (statusFilter === "none" ? statuses.length === 0 : statuses.includes(statusFilter));
          const linkBlob = ticketLinks(item).map((link) => link.key + " " + link.status).join(" ");
          const blob = (item.id + " " + item.task + " " + item.area + " " + linkBlob + " " + (item.status || "")).toLowerCase();
          return priOk && statusOk && (!query || blob.includes(query));
        });
        tbody.replaceChildren();
        if (!rows.length) {
          const row = document.createElement("tr");
          const cell = el("td", null, "ამ ფილტრზე ტასკი არ არის.");
          cell.colSpan = 4;
          row.append(cell);
          tbody.append(row);
        }
        rows.forEach((item) => {
          const row = document.createElement("tr");
          const pri = el("span", "pri " + (item.priority || ""), PRIORITY[item.priority] || item.priority || "");
          const priCell = el("td");
          priCell.append(pri);
          const taskCell = el("td");
          taskCell.append(document.createTextNode(item.task || ""));
          const links = ticketLinks(item);
          if (links.length === 1) {
            taskCell.append(jiraLink(links[0].key));
          } else if (links.length > 1) {
            const list = el("div", "jira-list");
            links.forEach((link) => {
              const wrap = el("span", "jira-item");
              wrap.append(jiraLink(link.key));
              if (link.status) wrap.append(statusPill(link.status));
              list.append(wrap);
            });
            taskCell.append(list);
          }
          row.append(el("td", "id", item.id || ""), taskCell, el("td", null, item.area || ""), priCell);
          tbody.append(row);
        });
        count.textContent = rows.length + " ტასკი ჩანს";
      }

      function paintStatuses(items) {
        const groups = new Map();
        items.forEach((item) => {
          const statuses = itemStatuses(item);
          const keys = statuses.length ? statuses : ["none"];
          keys.forEach((key) => {
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(item);
          });
        });
        const ordered = [...groups.keys()].sort((a, b) => {
          const ai = a === "none" ? 99 : STATUS_ORDER.indexOf(a);
          const bi = b === "none" ? 99 : STATUS_ORDER.indexOf(b);
          return (ai < 0 ? 50 : ai) - (bi < 0 ? 50 : bi);
        });
        statusCol.replaceChildren();
        statusCol.append(statusButton("all", "ყველა სტატუსი", items.length, items));
        ordered.forEach((key) => {
          const label = key === "none" ? "სტატუსის გარეშე" : key;
          statusCol.append(statusButton(key, label, groups.get(key).length, groups.get(key)));
        });
      }

      function statusButton(key, label, total, groupItems) {
        const card = el("div", "status-filter");
        const button = el("button");
        button.type = "button";
        button.className = "top";
        const pressed = statusFilter === key && priority === "all";
        button.setAttribute("aria-pressed", pressed ? "true" : "false");
        if (pressed) card.classList.add("on");
        button.append(el("span", null, label), el("span", "count-num", String(total)));
        card.append(button);
        if (key !== "all") {
          const pris = el("span", "status-pris");
          ["high", "medium"].forEach((level) => {
            const count = groupItems.filter((item) => item.priority === level).length;
            if (!count) return;
            const chipOn = statusFilter === key && priority === level;
            const chip = el("button", level, PRIORITY[level] + " " + count);
            chip.type = "button";
            chip.setAttribute("aria-pressed", chipOn ? "true" : "false");
            if (chipOn) card.classList.add("on");
            chip.addEventListener("click", () => {
              if (statusFilter === key && priority === level) {
                priority = "all";
              } else {
                statusFilter = key;
                priority = level;
              }
              syncPriorityButtons();
              paint();
            });
            pris.append(chip);
          });
          if (pris.childElementCount) card.append(pris);
        }
        button.addEventListener("click", () => {
          statusFilter = key;
          priority = "all";
          syncPriorityButtons();
          paint();
        });
        return card;
      }

      function syncPriorityButtons() {
        filters.querySelectorAll("button").forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.priority === priority ? "true" : "false");
        });
      }

      quarters.forEach((quarter) => {
        const button = el("button", null, quarter.label + (quarter.current ? " · ახლა" : ""));
        button.type = "button";
        button.dataset.id = quarter.id;
        button.setAttribute("role", "tab");
        button.addEventListener("click", () => {
          activeId = quarter.id;
          statusFilter = "all";
          priority = "all";
          syncPriorityButtons();
          history.replaceState(null, "", "#" + quarter.id);
          paint();
        });
        tabs.append(button);
      });

      [
        ["all", "ყველა"],
        ["high", "მაღალი"],
        ["medium", "საშუალო"]
      ].forEach(([value, label]) => {
        const button = el("button", null, label);
        button.type = "button";
        button.dataset.priority = value;
        button.setAttribute("aria-pressed", value === "all" ? "true" : "false");
        button.addEventListener("click", () => {
          priority = value;
          syncPriorityButtons();
          paint();
        });
        filters.append(button);
      });

      search.addEventListener("input", paint);
      toolbar.append(tabs, filters, search);
      const statusCol = el("div", "status-col");
      const planLayout = el("div", "plan-layout");
      planLayout.append(statusCol, tableWrap);
      planSection.append(planHead, toolbar, planLayout, count);

      const work = el("section");
      work.id = "work";
      const workHead = el("div", "section-head");
      workHead.append(el("h2", null, "How We Work"));
      const workGrid = el("div", "how");
      (plan.howWeWork || []).forEach((rule, index) => {
        const card = el("article", "rule");
        card.append(el("div", "num", String(index + 1)), el("h3", null, rule));
        workGrid.append(card);
      });
      work.append(workHead, workGrid);

      function formatDay(iso) {
        if (!iso || iso.length < 10) return "";
        const [year, month, day] = iso.slice(0, 10).split("-");
        return day + "." + month + "." + year;
      }

      function activitySection(sourceQuarters) {
        const rows = [];
        sourceQuarters.forEach((quarter) => {
          (quarter.items || []).forEach((item) => {
            ticketLinks(item).forEach((link) => {
              const status = link.status || item.status || "";
              if (status !== "In Progress" && status !== "Done") return;
              rows.push({
                key: link.key,
                status,
                since: link.since || item.since || "",
                done: link.done || item.done || "",
                task: item.task || "",
                quarter: quarter.label || "",
                id: item.id || ""
              });
            });
          });
        });
        const section = el("section");
        section.id = "activity";
        const head = el("div", "section-head");
        const title = el("div");
        title.append(el("h2", null, "რა მიდის და რა დასრულდა"));
        title.append(el("p", null, "თარიღი ჯირაში სტატუსის შეცვლის დღეა."));
        head.append(title);
        const grid = el("div", "activity");
        grid.append(
          activityColumn("progress", "ახლა In Progress-ში", rows.filter((row) => row.status === "In Progress"), "since", "დან"),
          activityColumn("done", "როდის დასრულდა", rows.filter((row) => row.status === "Done"), "done", "დასრულდა")
        );
        section.append(head, grid);
        return section;
      }

      function activityColumn(kind, title, list, field, prefix) {
        const card = el("article", "panel activity-card " + kind);
        const sorted = list.slice().sort((a, b) => (b[field] || "").localeCompare(a[field] || ""));
        const heading = el("h3", null, title);
        card.append(heading, el("p", "kicker", sorted.length + " ტასკი"));
        if (!sorted.length) {
          card.append(el("p", "lead", "ამ სიაში ტასკი არ არის."));
          return card;
        }
        const ul = document.createElement("ul");
        ul.className = "activity-list";
        sorted.forEach((row) => {
          const li = document.createElement("li");
          const when = formatDay(row[field]);
          const badge = el("span", "when-badge");
          badge.append(el("span", "when-date", when || "—"), el("span", "when-note", when ? prefix : "თარიღი არაა"));
          li.append(badge);
          const body = el("div");
          body.append(el("div", "activity-task", row.id + ". " + row.task));
          const meta = el("div", "activity-meta");
          meta.append(jiraLink(row.key), el("span", "tag", row.quarter));
          body.append(meta);
          li.append(body);
          ul.append(li);
        });
        card.append(ul);
        return card;
      }

      const planPage = el("div", "view");
      planPage.dataset.view = "plan";
      planPage.append(hero, goals, planSection, activitySection(quarters), work);

      const feedbackPage = renderFeedback(plan.feedback || {});
      main.replaceChildren(planPage, pvmPage, feedbackPage);

      const views = { plan: planPage, pvm: pvmPage, feedback: feedbackPage };
      function pageFromHash() {
        const hash = location.hash.replace("#", "");
        if (hash === "pvm" || hash === "feedback") return hash;
        return "plan";
      }
      function showPage(page) {
        Object.entries(views).forEach(([name, node]) => {
          node.hidden = name !== page;
        });
        document.querySelectorAll("nav [data-page]").forEach((button) => {
          if (button.dataset.page === page) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
      }
      document.querySelectorAll("nav [data-page]").forEach((button) => {
        button.onclick = () => {
          const page = button.dataset.page;
          const next = page === "plan" ? "#plan" : "#" + page;
          if (location.hash !== next) history.pushState(null, "", next);
          showPage(page);
        };
      });
      window.onhashchange = () => showPage(pageFromHash());
      showPage(pageFromHash());

      const foot = document.querySelector("#foot");
      foot.replaceChildren();
      const source = safeUrl(plan.sourceUrl);
      const line = el("p");
      line.append(document.createTextNode("წყარო: Slack canvas. "));
      if (source) {
        const link = el("a", null, "კანვასის გახსნა");
        link.href = source;
        line.append(link);
      }
      foot.append(
        line,
        el("p", null, "ბმულის მქონეს ამ გვერდის წაკითხვა შეუძლია. საძიებო სისტემებს ინდექსაცია ეთხოვებათ არ გააკეთონ.")
      );
      paint();
    }

    async function main() {
      const root = document.querySelector("main");
      try {
        const response = await fetch("plan.json?ts=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));
        render(await response.json());
      } catch (error) {
        root.replaceChildren(el("p", "error", "გეგმა ვერ ჩაიტვირთა. განაახლე გვერდი."));
      }
    }

    main();
  </script>
</body>
</html>
