name: Sync Jira status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-jira-status.yml
      - scripts/run-jira-status-clock.sh
  schedule:
    # Restart only. GitHub delays and drops a */5 schedule, so this is not the clock.
    - cron: "17,47 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Skip this start when a shift is already running
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 20
          others="$(gh run list --workflow sync-jira-status.yml --limit 40 --json databaseId,status --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"requested\" or .status == \"pending\"))] | length" || echo 1)"
          if [ "$others" != "0" ]; then
            echo "A sync shift is already active. This restart check stops."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No active shift. Starting the 5-minute clock."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Sync on every 5-minute mark
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: bash scripts/run-jira-status-clock.sh

      - name: Start a new shift if this one did not hand off
        if: always() && steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sleep 15
          others="$(gh run list --workflow sync-jira-status.yml --limit 40 --json databaseId,status --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"requested\" or .status == \"pending\"))] | length" || echo 0)"
          if [ "$others" != "0" ]; then
            echo "The next shift is already active."
            exit 0
          fi
          gh workflow run sync-jira-status.yml --ref main
